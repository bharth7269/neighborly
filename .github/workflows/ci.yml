# =============================================================================
# DevGuard pipeline for Neighborly
#
#   tests ──▶ security gate ──▶ docker build (SHA tag) ──▶ Trivy scan ──▶ Docker Hub
#             (SonarCloud +                                              (main branch
#              Gitleaks)                                                  pushes only)
#
# Every arrow is a hard dependency: if a stage fails, nothing after it runs,
# so bad code, leaked secrets or vulnerable images never reach Docker Hub/AWS.
# =============================================================================
name: DevGuard pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devguard-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/neighborly

jobs:
  # ---------------------------------------------------------------- Stage 1
  unit-tests:
    name: 1 · Unit tests, lint, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: web/coverage/lcov.info, retention-days: 7 }

  database-tests:
    name: 1 · Database security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + 81 security checks
        run: bash ./supabase/tests/run.sh
        env: { PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }

  # ---------------------------------------------------------------- Stage 2
  gitleaks:
    name: 2 · Security gate · Gitleaks
    needs: [unit-tests, database-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  sonarcloud:
    name: 2 · Security gate · SonarCloud
    needs: [unit-tests, database-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: coverage, path: web/coverage }
      - name: Scan and wait for the Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------------- Stage 3–5
  image:
    name: 3–5 · Docker build (SHA) · Trivy · Docker Hub
    needs: [gitleaks, sonarcloud]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Tag = short commit SHA
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 3 · Build image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            APP_VERSION=${{ steps.meta.outputs.tag }}

      - name: Smoke test /health
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE:${{ steps.meta.outputs.tag }}"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke; exit 1

      - name: 4 · Trivy vulnerability scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5 · Push verified image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Image"
            echo "\`$IMAGE:${{ steps.meta.outputs.tag }}\`"
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Pushed to Docker Hub."
            else
              echo "Built and scanned only (pull request)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Stage 6–8 (deploy to idle EC2 → health check → ALB switch) is added
  # after the Terraform module is in place.
