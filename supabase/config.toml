# Supabase CLI configuration (used by `supabase start` locally and as the
# reference for dashboard settings in production — see README → Production checklist).
project_id = "neighborly"

[api]
enabled = true
port = 54321
schemas = ["public"]          # "private" is deliberately NOT exposed
extra_search_path = ["extensions"]
max_rows = 500

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
email_sent = 4
sms_sent = 10
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.sms]
enabled = true
enable_confirmations = true
max_frequency = "60s"

[functions.handover-photo]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
