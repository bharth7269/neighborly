# SonarCloud analysis settings. Organization and project key come from the
# GitHub repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
sonar.projectName=Neighborly
sonar.sourceEncoding=UTF-8

sonar.sources=web/src,supabase/functions,supabase/migrations
sonar.tests=web/src,supabase/tests
sonar.test.inclusions=web/src/**/*.test.ts,supabase/tests/**
sonar.exclusions=web/src/**/*.test.ts,**/node_modules/**,**/dist/**

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
# UI components are covered by manual and end-to-end testing; coverage is measured on logic.
sonar.coverage.exclusions=web/src/pages/**,web/src/components/**,web/src/App.tsx,web/src/main.tsx,web/src/state/**,supabase/**
